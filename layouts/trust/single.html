{{ define "main" }}

<section class="page">
  <div class="container--narrow">
    <p class="page__kicker">{{ .Params.kicker | default "About" }}</p>
    <h1 class="page__title">{{ .Title }}</h1>
    {{ if .Params.description }}
    <p class="page__lead">{{ .Params.description }}</p>
    {{ end }}
    <div class="page__body">
      {{ .Content }}
    </div>
  </div>
</section>

{{ end }}
