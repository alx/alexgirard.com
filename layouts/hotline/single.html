{{ define "main" }}

<!-- INVITE HERO -->
<section class="invite-hero">
  <div class="container--narrow">
    <p class="invite-hero__kicker">Early access</p>
    <h1 class="invite-hero__title">You're in.</h1>
    <p class="invite-hero__body">I'm opening the hotline to a small group of people this month. Two ways in: send a question below, or grab 15 minutes on the calendar.</p>
  </div>
</section>

<!-- HOTLINE FORM -->
{{ partial "hotline.html" . }}

<!-- CAL.COM EMBED -->
<section class="invite-cal">
  <div class="container--narrow">
    <p class="invite-cal__heading">Or, pick a slot.</p>
    <div style="width:100%;height:600px;overflow:scroll" id="my-cal-inline-quick-call-15min"></div>
  </div>
</section>

<script type="text/javascript">
  (function (C, A, L) { let p = function (a, ar) { a.q.push(ar); }; let d = C.document; C.Cal = C.Cal || function () { let cal = C.Cal; let ar = arguments; if (!cal.loaded) { cal.ns = {}; cal.q = cal.q || []; d.head.appendChild(d.createElement("script")).src = A; cal.loaded = true; } if (ar[0] === L) { const api = function () { p(api, arguments); }; const namespace = ar[1]; api.q = api.q || []; if(typeof namespace === "string"){cal.ns[namespace] = cal.ns[namespace] || api;p(cal.ns[namespace], ar);p(cal, ["initNamespace", namespace]);} else p(cal, ar); return;} p(cal, ar); }; })(window, "https://app.cal.com/embed/embed.js", "init");
  Cal("init", "quick-call-15min", {origin:"https://app.cal.com"});
  Cal.config = Cal.config || {};
  Cal.config.forwardQueryParams = true;

  Cal.ns["quick-call-15min"]("inline", {
    elementOrSelector:"#my-cal-inline-quick-call-15min",
    config: {"layout":"month_view","useSlotsViewOnSmallScreen":"true"},
    calLink: "alx-girard/quick-call-15min",
  });

  Cal.ns["quick-call-15min"]("ui", {"hideEventTypeDetails":false,"layout":"month_view"});
</script>

{{ end }}
